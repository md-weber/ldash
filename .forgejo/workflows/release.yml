name: Release

on:
  push:
    tags:
      - 'v*'

env:
  ZIG_VERSION: "0.13.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: codeberg-medium
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: ldash-x86_64-unknown-linux-gnu
            zigbuild: false
          - target: aarch64-unknown-linux-gnu
            artifact: ldash-aarch64-unknown-linux-gnu
            zigbuild: true
          - target: x86_64-apple-darwin
            artifact: ldash-x86_64-apple-darwin
            zigbuild: true
          - target: aarch64-apple-darwin
            artifact: ldash-aarch64-apple-darwin
            zigbuild: true

    steps:
      - uses: actions/checkout@v4

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-

      - name: Install zig + cargo-zigbuild
        if: matrix.zigbuild
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /usr/local
          echo "/usr/local/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked

      - name: Install macOS SDK (Apple targets)
        if: contains(matrix.target, 'apple-darwin')
        run: |
          SDK_VER="11.3"
          SDK_DIR="/opt/MacOSX${SDK_VER}.sdk"
          if [ ! -d "$SDK_DIR" ]; then
            sudo mkdir -p /opt
            curl -fsSL "https://github.com/phracker/MacOSX-SDKs/releases/download/${SDK_VER}/MacOSX${SDK_VER}.sdk.tar.xz" \
              | sudo tar -xJ -C /opt
          fi
          echo "SDKROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build (native)
        if: "!matrix.zigbuild"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package
        run: |
          BIN="target/${{ matrix.target }}/release/ldash"
          # strip only works on native target; skip silently for cross-compiled
          strip "$BIN" 2>/dev/null || true
          mkdir -p stage
          cp "$BIN" stage/ldash
          cp man/ldash.1 stage/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: codeberg-small
    steps:
      - uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          find . -type f -name "*.tar.gz" -exec cp {} . \;
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          API_BASE="${GITHUB_API_URL:-${FORGEJO_API_URL:-}}"
          REPO="${GITHUB_REPOSITORY:-${FORGEJO_REPOSITORY:-}}"
          TOKEN="${GITHUB_TOKEN:-${FORGEJO_TOKEN:-}}"
          API="${API_BASE}/repos/${REPO}/releases"

          if [ -z "${API_BASE}" ] || [ -z "${REPO}" ] || [ -z "${TOKEN}" ]; then
            echo "Missing API context or token."
            echo "GITHUB_API_URL='${GITHUB_API_URL:-}'"
            echo "GITHUB_REPOSITORY='${GITHUB_REPOSITORY:-}'"
            echo "FORGEJO_API_URL='${FORGEJO_API_URL:-}'"
            echo "FORGEJO_REPOSITORY='${FORGEJO_REPOSITORY:-}'"
            exit 1
          fi

          CREATE_PAYLOAD="{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false}"
          CREATE_RESP="$(mktemp)"
          CREATE_CODE="$(curl -sS -o "${CREATE_RESP}" -w "%{http_code}" -X POST "${API}" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${CREATE_PAYLOAD}")"

          if [ "${CREATE_CODE}" -ge 300 ]; then
            echo "Release creation failed (HTTP ${CREATE_CODE})"
            cat "${CREATE_RESP}"
            exit 1
          fi

          RELEASE_ID="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); rid=d.get("id"); print(rid if rid is not None else "");' "${CREATE_RESP}")"
          if [ -z "${RELEASE_ID}" ]; then
            echo "Release creation response missing id:"
            cat "${CREATE_RESP}"
            exit 1
          fi

          for file in artifacts/*.tar.gz artifacts/SHA256SUMS; do
            curl -sS -f -X POST \
              "${API}/${RELEASE_ID}/assets?name=$(basename "$file")" \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file"
            echo "Uploaded $(basename "$file")"
          done
