[package]
name = "ldash"
version = "1.0.0"
edition = "2021"
description = "Terminal dashboard TUI for hledger — crypto portfolio, net worth, and monthly income/expenses"
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/md-weber/ldash"
readme = "README.md"
keywords = ["hledger", "finance", "tui", "ledger", "dashboard"]
categories = ["command-line-utilities", "visualization"]
exclude = [
    "plans/",
    "docs/",
    ".forgejo/",
    ".cursor/",
    "target/",
    "strategy.md",
]

[[bin]]
name = "ldash"
path = "src/main.rs"

[lib]
name = "ldash"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
chrono = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "7"
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
insta = "1"
