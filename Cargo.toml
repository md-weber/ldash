[package]
name = "ledger_dashboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ldash"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
chrono = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "7"
clap = { version = "4.6.1", features = ["derive"] }
