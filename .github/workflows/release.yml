name: Release

on:
  push:
    tags:
      - 'v*'

env:
  ZIG_VERSION: "0.13.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: ldash-x86_64-unknown-linux-gnu
            zigbuild: false
          - target: aarch64-unknown-linux-gnu
            artifact: ldash-aarch64-unknown-linux-gnu
            zigbuild: true
          - target: x86_64-apple-darwin
            artifact: ldash-x86_64-apple-darwin
            zigbuild: true
          - target: aarch64-apple-darwin
            artifact: ldash-aarch64-apple-darwin
            zigbuild: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-

      - name: Cache zig + cargo-zigbuild
        if: matrix.zigbuild
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/zig-linux-x86_64-${{ env.ZIG_VERSION }}
            ~/.cargo/bin/cargo-zigbuild
          key: zig-${{ env.ZIG_VERSION }}-zigbuild

      - name: Install zig + cargo-zigbuild
        if: matrix.zigbuild && steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /usr/local
          cargo install cargo-zigbuild --locked

      - name: Add zig to PATH
        if: matrix.zigbuild
        run: echo "/usr/local/zig-linux-x86_64-${{ env.ZIG_VERSION }}" >> "$GITHUB_PATH"

      - name: Cache macOS SDK
        if: contains(matrix.target, 'apple-darwin')
        id: cache-macos-sdk
        uses: actions/cache@v4
        with:
          path: /opt/MacOSX11.3.sdk
          key: macos-sdk-11.3

      - name: Install macOS SDK (Apple targets)
        if: contains(matrix.target, 'apple-darwin') && steps.cache-macos-sdk.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt
          curl -fsSL "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz" \
            | sudo tar -xJ -C /opt

      - name: Set macOS SDK env
        if: contains(matrix.target, 'apple-darwin')
        run: |
          echo "SDKROOT=/opt/MacOSX11.3.sdk" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build (native)
        if: "!matrix.zigbuild"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package
        run: |
          BIN="target/${{ matrix.target }}/release/ldash"
          strip "$BIN" 2>/dev/null || true
          mkdir -p stage
          cp "$BIN" stage/ldash
          cp man/ldash.1 stage/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts and checksums
        run: |
          cd artifacts
          find . -type f -name "*.tar.gz" -exec cp {} . \;
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
